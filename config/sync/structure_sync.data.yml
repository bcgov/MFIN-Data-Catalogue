          value: "<p class=\"techalert\">Technical alert</p>\r\n\r\n<div class=\"row two-col-right\">\r\n<div class=\"col-md-8 col-main\">\r\n<h2><img alt=\"alert icon\" class=\"pb-2\" src=\"https://intranet.fin.gov.bc.ca/sites/default/files/svg/corporate-services-division/alert-red-svg.svg\" style=\"display: inline-block;\" width=\"35px\" />&nbsp; Do not take government-issued devices outside of Canada</h2>\r\n\r\n<p>Personal and government information may be at higher risk when you travel. Hackers, organized crime and foreign governments may target your devices and gain access to sensitive data.</p>\r\n\r\n<p><a href=\"https://www2.gov.bc.ca/assets/gov/british-columbians-our-governments/services-policies-for-government/policies-procedures/it-policies/foreign_travel_tip_sheet.pdf\" rel=\"noopener\" target=\"_blank\" title=\"Open document\">Learn more about this policy (pdf)</a></p>\r\n</div>\r\n\r\n<div class=\"col-md-4 col-sidebar\">\r\n<drupal-media data-entity-type=\"media\" data-entity-uuid=\"897f95e9-1365-40d3-b5b0-55324cde12b6\"></drupal-media>\r\n</div>\r\n</div>\r\n"
