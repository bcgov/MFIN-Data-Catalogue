        -
          value: "<h3 class=\"text-align-center\">&nbsp;FINStrong micro-learning series</h3>\r\n\r\n<drupal-media class=\"\" data-align=\"center\" data-entity-type=\"media\" data-entity-uuid=\"81f6d452-2260-4dd7-9406-ceed8c5c2b4b\" data-my-data=\"\"></drupal-media>\r\n\r\n<p>Get a better understanding of the <a href=\"https://www.guardingmindsatwork.ca/about/about-psychosocial-factors\" rel=\"noopener\" target=\"_blank\">13 Psychosocial Factors</a> and learn how to positively promote them in the workplace with a new series of micro-learning sessions for employees, from PWI.</p>\r\n\r\n<p><a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"f08bfc8c-bb22-4ee8-bda8-3151416d6224\" href=\"/node/569\" title=\"FINStrong micro-learning series\">Learn more and sign up today.</a></p>\r\n\r\n<p>&nbsp;</p>\r\n"
