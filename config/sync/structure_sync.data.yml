          value: "<h3>CMS Training for FINtranet</h3>\r\n\r\n<p>Your guide to contributing content to the Ministry of Finance intranet.</p>\r\n\r\n<p><a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"0f219a21-1834-4321-b491-f5d1b4d967a7\" href=\"/node/131\">Getting started with FINtranet</a><br />\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"52a76813-9f43-4769-8508-9e3e62ba4575\" href=\"/node/132\">User roles and permissions</a><br />\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"3326d02a-bf2f-4110-a7ce-2897f1b8680e\" href=\"/node/133\">Site governance</a></p>\r\n\r\n<p><strong>Guides</strong><br />\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"a082d0f8-9bbd-4464-9972-081d7d8d1968\" href=\"/node/134\">Create an article</a><br />\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"df1f1948-bc6a-4ce0-bea8-f761f5ba07ab\" href=\"/node/135\">Create a program</a><br />\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"c572e137-173f-4293-a27a-a5f8d61259c1\" href=\"/node/136\">Create a service</a><br />\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"a22287ad-6b3f-45f6-8423-5d6936f35331\" href=\"/node/138\">Create a page</a><br />\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"cc5a6b0e-8a37-482c-a4b9-02f4492a6d87\" href=\"/node/110\">Using files and media</a><br />\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"e15a5c73-edfe-4a85-b1c7-34145edeb769\" href=\"/node/137\">Using the WYSIWYG editor</a><br />\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"25f0933b-91bd-4d4f-ae7e-35523743204b\" href=\"/node/107\">Styles and formatting</a></p>\r\n"
