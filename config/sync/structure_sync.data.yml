        -
          value: "<p>Post new available Finance positions <a href=\"https://intranet.fin.gov.bc.ca/node/add/job_posting?destination=/jobs\" title=\"Add new job\">here</a> on the <a href=\"https://intranet.fin.gov.bc.ca/jobs\">job board</a>. For a complete list of jobs, please visit <a href=\"https://search.employment.gov.bc.ca\" target=\"_blank\">Careers &amp; MyHR</a>.<br />\r\n<br />\r\nFor internal postings (only open to Finance employees), visit the <a href=\"https://intranet.fin.gov.bc.ca/internal-jobs\">internal jobs page</a>.</p>\r\n\r\n<p><strong>Please note:</strong> The Ministry of Finance job board is not a comprehensive list of all available jobs.</p>\r\n"
