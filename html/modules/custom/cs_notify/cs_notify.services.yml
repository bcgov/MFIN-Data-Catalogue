services:
  cs_notify.client:
    class: Drupal\cs_notify\Service\NotificationClient
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@logger.factory'

  Drupal\cs_notify\Service\NotificationClientInterface:
    alias: cs_notify.client

  cs_notify.notification_queue:
    class: Drupal\cs_notify\Service\NotificationQueueService
    arguments:
      - '@logger.factory'
      - '@queue'