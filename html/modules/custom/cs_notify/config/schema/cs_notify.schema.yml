cs_notify.settings:
  type: config_object
  label: 'CS Notify settings'
  mapping:
    api_url:
      type: string
      label: 'API URL'

    api_key:
      type: string
      label: 'API key'

    timeout:
      type: integer
      label: 'HTTP timeout'

    process_notify_queues_during_cron:
      type: boolean
      label: 'Process Notify queues using Drupal cron'