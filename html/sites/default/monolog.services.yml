parameters:
  monolog.channel_handlers:
    # Use 'stdout' as the default handler for all Drupal log channels
    default: ['stdout']

services:
  # Define the STDOUT stream handler
  monolog.handler.stdout:
    class: Monolog\Handler\StreamHandler
    arguments: ['php://stdout', 'DEBUG']
    calls:
      - [setFormatter, ['@monolog.formatter.json']]
    tags:
      - { name: monolog.handler, channel: default }

  # Define a JSON formatter so Loki can easily parse fields
  monolog.formatter.json:
    class: Monolog\Formatter\JsonFormatter

